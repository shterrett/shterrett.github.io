<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title$ — Program Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/program.css">
</head>
<body>
<div class="program-page">
  <header class="concert-masthead">
    <div class="presenter-label">$presenter$ · Program Notes</div>
    <h1 class="concert-title">$title$</h1>
    <p class="concert-subtitle">$subtitle$</p>
    <div class="concert-meta">
      <div>$performer$</div>
      <div>$date$</div>
      <div>$venue$</div>
    </div>
  </header>
  $partial("templates/program-list.html")$
  $partial("templates/program-overview.html")$
  $partial("templates/program-piece.html")$
</div>
</body>
</html>
