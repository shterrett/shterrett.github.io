worker_processes 1;

# Logs and pid written into the project directory — no root access needed
error_log  /Users/stuart/program-notes/logs/error.log;
pid        /Users/stuart/program-notes/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Apple Silicon Homebrew path; Intel Macs use /usr/local/etc/nginx/mime.types
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;

    server {
        listen       8080;
        server_name  _;

        root  /Users/stuart/program-notes/_site;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
